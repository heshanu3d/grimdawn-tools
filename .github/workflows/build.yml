name: Build Windows DLLs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package x86 + x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download llvm-mingw
        shell: bash
        env:
          LLVM_MINGW_VERSION: "20260616"
        run: |
          set -euo pipefail
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${archive}"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          mkdir llvm-mingw
          tar -xJf "$archive" --strip-components=1 -C llvm-mingw
          echo "$GITHUB_WORKSPACE/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build x64
        shell: bash
        env:
          ARCH: x64
          TARGET_TRIPLE: x86_64-w64-mingw32
          CC: x86_64-w64-mingw32-clang
          OUT: ${{ github.workspace }}/dist/dpyes_ext-x64.dll
          EXTRA_CFLAGS: -Werror -Wno-unused-parameter
        run: ./build.sh

      - name: Build x86
        shell: bash
        env:
          ARCH: x86
          TARGET_TRIPLE: i686-w64-mingw32
          CC: i686-w64-mingw32-clang
          OUT: ${{ github.workspace }}/dist/dpyes_ext-x86.dll
          EXTRA_CFLAGS: -Werror -Wno-unused-parameter
        run: ./build.sh

      - name: Verify PE architectures
        shell: bash
        run: |
          set -euo pipefail
          file dist/dpyes_ext-x64.dll | tee /dev/stderr | grep -q 'PE32+.*x86-64'
          file dist/dpyes_ext-x86.dll | tee /dev/stderr | grep -q 'PE32 executable.*Intel 80386'

      # upload-artifact 会自行生成一个 ZIP，因此这里直接上传两个 DLL，
      # 避免下载后出现 ZIP 中再嵌套一个同名 ZIP。
      - name: Upload combined DLL package
        uses: actions/upload-artifact@v4
        with:
          name: dpyes-ext-windows-x86-x64
          path: |
            dist/dpyes_ext-x64.dll
            dist/dpyes_ext-x86.dll
          if-no-files-found: error
          compression-level: 9
