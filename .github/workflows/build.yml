name: Build Windows DLLs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            arch: x64
            target: x86_64-w64-mingw32
          - name: x86
            arch: x86
            target: i686-w64-mingw32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download llvm-mingw
        shell: bash
        env:
          LLVM_MINGW_VERSION: "20260616"
        run: |
          set -euo pipefail
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${archive}"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          mkdir llvm-mingw
          tar -xJf "$archive" --strip-components=1 -C llvm-mingw
          echo "$GITHUB_WORKSPACE/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          TARGET_TRIPLE: ${{ matrix.target }}
          CC: ${{ matrix.target }}-clang
          OUT: ${{ github.workspace }}/dist/dpyes_ext-${{ matrix.name }}.dll
          EXTRA_CFLAGS: -Werror -Wno-unused-parameter
        run: ./build.sh

      - name: Verify PE architecture
        shell: bash
        run: |
          set -euo pipefail
          output="dist/dpyes_ext-${{ matrix.name }}.dll"
          file "$output"
          case "${{ matrix.arch }}" in
            x64) file "$output" | grep -q 'PE32+.*x86-64' ;;
            x86) file "$output" | grep -q 'PE32 executable.*Intel 80386' ;;
          esac

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: dpyes-ext-${{ matrix.name }}
          path: dist/dpyes_ext-${{ matrix.name }}.dll
          if-no-files-found: error
